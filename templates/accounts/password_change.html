{% extends "base.html" %}
{% load i18n %}
{% block content %}
<section class="auth-page container section-gap">
  <h1>{% trans "Зміна пароля" %}</h1>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-field">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="field-error">{{ field.errors.0 }}</div>{% endif %}
      {% if field.help_text %}<p class="form-help">{{ field.help_text }}</p>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn--primary">{% trans "Зберегти" %}</button>
  </form>
</section>
{% endblock %}
