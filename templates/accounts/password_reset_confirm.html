{% extends "base.html" %}
{% load i18n vstatic %}

{% block extra_css %}
<link rel="stylesheet" href="{% vstatic 'css/components/auth.css' %}">
{% endblock %}
{% block content %}
<section class="auth-page container section-gap">
  <h1>{% trans "Новий пароль" %}</h1>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn--primary">{% trans "Зберегти" %}</button>
  </form>
</section>
{% endblock %}
