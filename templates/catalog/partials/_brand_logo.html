{% comment %}Wordmark when cover image is absent (logo fields removed).{% endcomment %}
<svg
  class="brand-logo__wordmark"
  viewBox="0 0 {% widthratio brand.name|length 1 18 %} 34"
  role="img"
  aria-label="{{ brand.name }}"
>
  <text x="50%" y="24" text-anchor="middle">{{ brand.name|upper }}</text>
</svg>
