# Production override: HTTPS nginx + Let's Encrypt mount.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  db:
    restart: always

  web:
    restart: always
    env_file: .env

  nginx:
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/docker.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_volume:/staticfiles:ro
      - media_volume:/media:ro
    depends_on:
      web:
        condition: service_started
