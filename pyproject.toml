[project]
name = "ogemed"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.16",
    "django-environ==0.12.0",
    "django-htmx==1.27.0",
    "django-q2==1.10.0",
    "Pillow==12.1.0",
    "psycopg2-binary==2.9.11",
    "gunicorn==24.1.0",
    "django-storages==1.14.6",
    "boto3==1.42.25",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "DJANGO_SETTINGS_MODULE=config.settings.production python manage.py migrate --noinput && DJANGO_SETTINGS_MODULE=config.settings.production python manage.py seed_demo"
